name: Backend CI

# Runs on every push (any branch — fast feedback while you're still working)
# and on every PR targeting development or master (this is what branch
# protection gates on before allowing a merge).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, master]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/TodoApp.sln

      - name: Build
        run: dotnet build backend/TodoApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/TodoApp.sln --no-build --configuration Release --verbosity normal
