name: Promote development to master

# Simulates a release cadence: a real project might cut a release from the
# integration branch every 2-week sprint after sign-off. We're speed-running
# while learning, so this promotes whatever's currently on development to
# master once a day instead.
#
# Requires a repo secret PROMOTE_TOKEN — a Personal Access Token, NOT the
# default GITHUB_TOKEN. Reason: GitHub refuses to let a PR/push made with
# the default GITHUB_TOKEN trigger other workflows (loop prevention). If we
# used it here, the pull_request-triggered build-and-test check — the one
# master's branch protection requires before merging — would simply never
# run on this bot-opened PR, and it would sit stuck forever. A PAT from a
# real account doesn't have that restriction.
on:
  schedule:
    # 00:00 America/Mexico_City. Mexico dropped DST nationwide in 2022
    # (border-strip municipalities excepted), so Mexico City is a fixed
    # UTC-6 year round — no seasonal cron adjustment needed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether there's anything to promote
        id: diff
        run: |
          git fetch origin master development
          AHEAD=$(git rev-list --count origin/master..origin/development)
          echo "Commits on development not yet on master: $AHEAD"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

      - name: Create or reuse promotion PR
        if: steps.diff.outputs.ahead != '0'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base master --head development --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing PR #$EXISTING"
            NUMBER="$EXISTING"
          else
            gh pr create --base master --head development \
              --title "Daily release: promote development to master ($(date -u +%Y-%m-%d))" \
              --body "Automated daily promotion. Everything currently on \`development\` that isn't yet on \`master\`. Merges automatically once the \`build-and-test\` check passes."
            NUMBER=$(gh pr list --base master --head development --state open --json number --jq '.[0].number')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge (auto-merge if checks are still pending, direct merge if already clean)
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          # In practice this PR's head commit almost always already has a
          # passing build-and-test check by the time we get here — every
          # commit gets one from backend-ci.yml's `push` trigger before any
          # promotion PR exists. GitHub's enablePullRequestAutoMerge refuses
          # to run on a PR that's already immediately mergeable ("clean
          # status" error) — auto-merge is only for PRs still waiting on
          # something. So: try auto-merge first for the rare case checks
          # are genuinely still running, fall back to a direct merge when
          # it's already clean.
          gh pr merge "${{ steps.pr.outputs.number }}" --merge --auto \
            || gh pr merge "${{ steps.pr.outputs.number }}" --merge
