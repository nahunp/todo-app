name: Frontend Deploy

# master is the production baseline (see README.md's Branching section) —
# deploy whenever frontend/** lands there. master is protected and
# requires frontend-ci.yml's build-and-test to pass before a merge can
# reach it, so this is a second build to produce the actual deploy
# artifact, not a substitute for that gate.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build -- --configuration production

      # Runtime config, not build-time — see runtime-config.ts's doc
      # comment for why. The committed config.js is the local-dev default
      # (empty apiBaseUrl, Cloudflare's test Turnstile key); production
      # gets its own copy of this exact file written into the build
      # output, same as the manual redeploy steps in README.md, just no
      # longer done by hand. TURNSTILE_SITE_KEY is a repo *variable*, not
      # a secret — Turnstile site keys are meant to ship in client code
      # (see runtime-config.ts), only the secret key is sensitive and it
      # never touches the frontend at all.
      - name: Write production runtime config
        working-directory: frontend
        run: |
          cat > dist/frontend/browser/config.js <<EOF
          window.__appConfig = {
            apiBaseUrl: "https://todoapp-api-us3zbx.azurewebsites.net",
            turnstileSiteKey: "${{ vars.TURNSTILE_SITE_KEY }}",
          };
          EOF

      # mobile-captcha.html (native mobile clients' Turnstile page — see
      # its own doc comment) carries the same committed-test-key /
      # overwritten-at-deploy split as config.js above, just via a plain
      # string replace instead of a whole-file rewrite, since most of that
      # file is static markup/JS that doesn't change per environment.
      - name: Write production site key into mobile-captcha.html
        working-directory: frontend
        run: sed -i 's/1x00000000000000000000AA/${{ vars.TURNSTILE_SITE_KEY }}/' dist/frontend/browser/mobile-captcha.html

      - name: Deploy to Azure Static Web Apps
        working-directory: frontend
        run: npx @azure/static-web-apps-cli deploy --app-location dist/frontend/browser --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOYMENT_TOKEN }}" --env production
