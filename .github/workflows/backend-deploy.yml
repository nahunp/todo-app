name: Backend Deploy

# master is the production baseline (see README.md's Branching section) —
# deploy whenever backend/** lands there. master is protected and requires
# backend-ci.yml's build-and-test to pass before a merge can reach it, so
# by the time this trigger fires the code has already been built and
# tested once; publishing again here is just to produce the actual deploy
# artifact, not a substitute for that gate.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

# Only one deploy in flight at a time — a second push landing mid-deploy
# waits for the first to finish rather than racing it against the same
# App Service slot.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

# id-token: write is what lets azure/login exchange a GitHub OIDC token for
# an Azure access token — no stored client secret or publish-profile
# password at all. Swapped in after azure/webapps-deploy + a publish
# profile turned out not to work here: this App Service has SCM Basic Auth
# publishing credentials disabled (Azure's secure-by-default setting), and
# even after temporarily re-enabling it, the action still rejected the
# profile ("invalid for app-name and slot-name provided") for reasons that
# didn't reproduce with a plain `az webapp deploy`. OIDC + `az webapp
# deploy` is both the fix and the more secure option, so kept even after
# the underlying policy got fixed.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: publish-and-deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish backend/src/WebApi/TodoApp.WebApi.csproj -c Release -o publish-out

      - name: Zip artifact
        run: Compress-Archive -Path publish-out/* -DestinationPath webapi.zip -Force
        shell: pwsh

      # Federated (OIDC) login — the app registration
      # (todoapp-github-actions-deploy) has a federated credential that
      # trusts only `repo:nahunp/todo-app:ref:refs/heads/master`, and is
      # scoped to nothing but this one App Service (Website Contributor,
      # scoped to the resource, not the resource group).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        run: az webapp deploy --resource-group rg-todoapp --name todoapp-api-us3zbx --src-path webapi.zip --type zip

      # Deliberately NOT running `dotnet ef database update` here.
      # Program.cs's own comment on this: production migrations are meant
      # to be an explicit, reviewed step against the target connection
      # string, not something that runs unattended on every deploy (no
      # chance to review the SQL first, and this project's Azure SQL
      # server isn't network-reachable from GitHub-hosted runners without
      # a firewall/credential change nobody's asked for yet). When a
      # change includes a migration, apply it by hand first — see
      # README.md's Deployment section for the exact command — then land
      # the code change here.
