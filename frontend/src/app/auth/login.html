<div class="auth-form">
  <h2>Login</h2>
  <div *ngIf="justRegistered()" class="success">Registered — please log in.</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" [disabled]="loading()" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" [disabled]="loading()" />
  </div>
  <div class="tag tag-warning password-reuse-warning">
    This is a personal demo project, not a production service — please use a throwaway password, not one you use elsewhere.
  </div>
  <div class="form-group">
    <button class="btn btn-primary" (click)="submit()" [disabled]="loading()">
      <span *ngIf="!loading()">Login</span>
      <span *ngIf="loading()">Logging in…</span>
    </button>
    <!-- Free-tier Azure SQL can take tens of seconds to wake up from an
         idle cold start — without this, a slow-but-working request looks
         identical to a broken one (a Diego-reported bug, found live). -->
    <p *ngIf="loading()" class="loading-hint">
      This can take a little longer than usual if the database has been idle.
    </p>
  </div>
</div>
