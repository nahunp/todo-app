<div class="auth-form">
  <h2>Register</h2>
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div>
    <label>Username <input [(ngModel)]="username" /></label>
  </div>
  <div>
    <label>Password <input type="password" [(ngModel)]="password" /></label>
  </div>
  <div>
    <button (click)="submit()" [disabled]="loading()">Register</button>
  </div>
</div>
