<div class="auth-form">
  <h2>Register</h2>
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" />
  </div>
  <div class="form-group">
    <button class="btn btn-primary" (click)="submit()" [disabled]="loading()">Register</button>
  </div>
</div>
