<div class="detail-page">
  <button class="btn btn-link" (click)="goBack()">← Back</button>

  <div *ngIf="loading()" class="loading">Loading…</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <div *ngIf="!loading() && list()" class="list-detail">
    <div class="list-header">
      <ng-container *ngIf="!editingList(); else editListTpl">
        <h1>{{ list()!.name }}</h1>
        <button class="btn btn-secondary" (click)="startRenameList()">Rename list</button>
      </ng-container>
      <ng-template #editListTpl>
        <div class="edit-list">
          <input class="edit-input" [ngModel]="editingListName()" (ngModelChange)="editingListName.set($event)" />
          <button class="btn btn-primary" (click)="saveRenameList()">Save</button>
          <button class="btn btn-secondary" (click)="cancelRenameList()">Cancel</button>
        </div>
      </ng-template>
    </div>

    <div class="add-item-section">
      <div class="form-group">
        <label for="new-item">Add item</label>
        <div class="input-group">
          <input id="new-item" placeholder="New item title" [ngModel]="newTitle()" (ngModelChange)="newTitle.set($event)" />
          <button class="btn btn-primary" (click)="addItem()">Add</button>
        </div>
      </div>
    </div>

    <div class="items-list">
      <div *ngFor="let item of list()!.items" class="item-card">
        <ng-container *ngIf="editingItemId() !== item.id; else editItemTpl">
          <div class="item-header">
            <div class="checkbox-wrapper">
              <input type="checkbox" [id]="'item-' + item.id" [checked]="item.isDone" (change)="toggleComplete(item)" />
              <label [for]="'item-' + item.id" [ngClass]="{'checkbox-label': true, 'completed': item.isDone}">
                {{ item.title }}
              </label>
            </div>
          </div>

          <div class="item-metadata" *ngIf="item.notes">
            <small>{{ item.notes }}</small>
          </div>

          <div class="item-tags">
            <span class="tag priority-tag" [ngClass]="getPriorityTagClass(item.priority)">
              {{ item.priority }}
            </span>
            <span *ngIf="item.dueDateState !== 'None'" class="tag" [ngClass]="getDueDateTagClass(item.dueDateState)">
              {{ getDueDateTagLabel(item.dueDateState) }}
            </span>
            <span *ngIf="item.category !== 'None'" class="tag" [ngClass]="getCategoryTagClass(item.category)">
              {{ item.category }}
            </span>
          </div>

          <div class="item-actions">
            <div class="action-row">
              <label [for]="'priority-select-' + item.id">Priority:</label>
              <select class="item-select" [id]="'priority-select-' + item.id" (change)="onPriorityChange(item.id, $event)" [value]="item.priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="action-row">
              <label [for]="'duedate-input-' + item.id">Due date:</label>
              <input type="date" class="item-input" [id]="'duedate-input-' + item.id" [value]="item.dueDate ? (item.dueDate | date:'yyyy-MM-dd') : ''" (change)="onDueDateChange(item.id, $event)" />
            </div>

            <div class="action-row">
              <label [for]="'category-select-' + item.id">Category:</label>
              <select class="item-select" [id]="'category-select-' + item.id" (change)="onCategoryChange(item.id, $event)" [value]="item.category">
                <option value="None">None</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Health">Health</option>
              </select>
            </div>
          </div>

          <div class="item-buttons">
            <button class="btn btn-secondary" (click)="startRenameItem(item)">Rename</button>
            <ng-container *ngIf="pendingDeleteItemId() !== item.id; else confirmRemoveTpl">
              <button class="btn btn-destructive" (click)="startRemoveItem(item)">Remove</button>
            </ng-container>
          </div>
        </ng-container>

        <ng-template #editItemTpl>
          <div class="edit-item">
            <input class="edit-input" [ngModel]="editingItemTitle()" (ngModelChange)="editingItemTitle.set($event)" />
            <button class="btn btn-primary" (click)="saveRenameItem()">Save</button>
            <button class="btn btn-secondary" (click)="cancelRenameItem()">Cancel</button>
          </div>
        </ng-template>

        <ng-template #confirmRemoveTpl>
          <div class="confirm-remove">
            <span class="confirm-text">Confirm remove?</span>
            <button class="btn btn-destructive" (click)="confirmRemoveItem()">Yes</button>
            <button class="btn btn-secondary" (click)="cancelRemoveItem()">No</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
